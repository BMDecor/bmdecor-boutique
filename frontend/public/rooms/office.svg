  <rect x="464" y="96" width="112" height="4" fill="#B8B0A6"/>
  <rect x="464" y="152" width="112" height="4" fill="#B8B0A6"/>
  <rect x="464" y="208" width="112" height="4" fill="#B8B0A6"/>
  <rect x="464" y="264" width="112" height="4" fill="#B8B0A6"/>
  <!-- Books row 1 -->
  <rect x="470" y="48" width="8" height="46" rx="1" fill="#C8BAA8"/>
  <rect x="480" y="52" width="10" height="42" rx="1" fill="#B8C4A8"/>
  <rect x="492" y="50" width="7" height="44" rx="1" fill="#C4B8B0"/>
  <rect x="501" y="48" width="12" height="46" rx="1" fill="#D0C0B0"/>
  <rect x="515" y="54" width="8" height="40" rx="1" fill="#A8B8C4"/>
  <rect x="525" y="50" width="10" height="44" rx="1" fill="#C0B8A8"/>
  <rect x="537" y="48" width="8" height="46" rx="1" fill="#B0A8C0"/>
  <rect x="548" y="52" width="12" height="42" rx="1" fill="#C8C0B4"/>
  <!-- Books row 2 -->
  <rect x="470" y="104" width="10" height="46" rx="1" fill="#BEB6A8"/>
  <rect x="482" y="108" width="8" height="42" rx="1" fill="#A8B0A8"/>
  <rect x="492" y="106" width="12" height="44" rx="1" fill="#D0C4B4"/>
  <rect x="510" y="110" width="14" height="40" rx="1" fill="#C0B0A0"/>
  <rect x="528" y="104" width="8" height="46" rx="1" fill="#B4C0B8"/>
  <rect x="540" y="108" width="10" height="42" rx="1" fill="#C8BEB0"/>
  <!-- Books row 3 -->
  <rect x="470" y="160" width="12" height="46" rx="1" fill="#C4BCA8"/>
  <rect x="484" y="164" width="8" height="42" rx="1" fill="#B0B8C4"/>
  <rect x="496" y="162" width="10" height="44" rx="1" fill="#D0C8B8"/>
  <!-- Decorative object -->
  <circle cx="536" cy="188" r="10" fill="#C8C0B4"/>
  <rect x="554" y="168" width="14" height="38" rx="2" fill="#B8C0A8"/>
  <!-- Books row 4 -->
  <rect x="470" y="216" width="8" height="46" rx="1" fill="#B8B0A4"/>
  <rect x="480" y="220" width="12" height="42" rx="1" fill="#C0C8B4"/>
  <rect x="496" y="218" width="8" height="44" rx="1" fill="#C4B8AC"/>
