  <rect x="176" y="186" width="108" height="56" rx="2" fill="#A8B0B8"/>
  <!-- Monitor stand -->
  <rect x="218" y="248" width="24" height="4" fill="#888078"/>
  <rect x="226" y="236" width="8" height="12" fill="#888078"/>
  <!-- Keyboard -->
  <rect x="186" y="255" width="88" height="8" rx="2" fill="#C0B8B0"/>
  <!-- Mouse -->
  <ellipse cx="298" cy="259" rx="10" ry="6" fill="#C0B8B0"/>
  <!-- Desk lamp -->
  <rect x="90" y="216" width="4" height="32" fill="#B0A8A0" transform="rotate(-15 92 232)"/>
  <ellipse cx="82" cy="214" rx="14" ry="8" fill="#D0C8C0" transform="rotate(-15 82 214)"/>
  <!-- Office chair -->
  <rect x="185" y="300" width="90" height="8" rx="3" fill="#A8A098"/>
  <rect x="195" y="308" width="70" height="22" rx="4" fill="#B0A8A0"/>
  <rect x="200" y="280" width="60" height="24" rx="6" fill="#B8B0A6"/>
