<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Wall -->
  <rect width="600" height="400" fill="#FAFAFA"/>
  <!-- Floor -->
  <rect y="330" width="600" height="70" fill="#DED8CE"/>
  <line x1="0" y1="330" x2="600" y2="330" stroke="#D0CAC0" stroke-width="1.5"/>
  <!-- Hardwood lines -->
  <line x1="0" y1="355" x2="600" y2="355" stroke="#D5CFC5" stroke-width="0.4"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#D5CFC5" stroke-width="0.4"/>
  <!-- Crown molding -->
  <rect y="16" width="600" height="6" fill="#F0EDE8" rx="1"/>
  <!-- Baseboard -->
  <rect y="322" width="600" height="10" fill="#EDEBE6" rx="1"/>
  <!-- Window -->
  <rect x="200" y="40" width="200" height="170" rx="3" stroke="#C8C2B8" stroke-width="2" fill="#EFF3F8"/>
  <line x1="300" y1="40" x2="300" y2="210" stroke="#C8C2B8" stroke-width="1.5"/>
  <line x1="200" y1="125" x2="400" y2="125" stroke="#C8C2B8" stroke-width="1.5"/>
  <!-- Curtains -->
