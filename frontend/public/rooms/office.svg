  <rect x="226" y="330" width="8" height="14" fill="#989088"/>
  <ellipse cx="230" cy="340" rx="30" ry="4" fill="#A09890"/>
  <!-- Coffee mug -->
  <rect x="322" y="240" width="10" height="10" rx="2" fill="#C0B0A0"/>
  <rect x="332" y="243" width="5" height="5" rx="2" fill="none" stroke="#C0B0A0" stroke-width="1"/>
  <!-- Plant -->
  <rect x="30" y="282" width="20" height="18" rx="4" fill="#B0A8A0"/>
  <ellipse cx="40" cy="272" rx="16" ry="14" fill="#A8C0A0"/>
  <ellipse cx="34" cy="266" rx="12" ry="10" fill="#B8CCA8"/>
