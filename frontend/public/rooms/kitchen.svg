  <line x1="190" y1="105" x2="410" y2="105" stroke="#C8C2B8" stroke-width="1.5"/>
  <!-- Backsplash -->
  <rect x="20" y="172" width="560" height="40" fill="#F0ECE6"/>
  <!-- Subway tile pattern -->
  <line x1="20" y1="185" x2="580" y2="185" stroke="#E8E4DE" stroke-width="0.5"/>
  <line x1="20" y1="198" x2="580" y2="198" stroke="#E8E4DE" stroke-width="0.5"/>
  <!-- Countertop -->
  <rect x="16" y="210" width="568" height="12" rx="2" fill="#C8C0B6"/>
  <!-- Lower cabinets -->
  <rect x="20" y="222" width="200" height="108" rx="3" fill="#E8E4DE" stroke="#D0C8BE" stroke-width="1"/>
  <rect x="25" y="228" width="90" height="96" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="125" y="228" width="90" height="96" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="112" y="265" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <rect x="128" y="265" width="2" height="20" rx="1" fill="#B0A8A0"/>
