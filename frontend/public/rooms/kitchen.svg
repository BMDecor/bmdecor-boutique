  <line x1="100" y1="330" x2="100" y2="400" stroke="#D8D2C8" stroke-width="0.5"/>
  <line x1="200" y1="330" x2="200" y2="400" stroke="#D8D2C8" stroke-width="0.5"/>
  <line x1="300" y1="330" x2="300" y2="400" stroke="#D8D2C8" stroke-width="0.5"/>
  <line x1="400" y1="330" x2="400" y2="400" stroke="#D8D2C8" stroke-width="0.5"/>
  <line x1="500" y1="330" x2="500" y2="400" stroke="#D8D2C8" stroke-width="0.5"/>
  <line x1="0" y1="365" x2="600" y2="365" stroke="#D8D2C8" stroke-width="0.5"/>
  <!-- Upper cabinets -->
  <rect x="20" y="30" width="120" height="120" rx="3" fill="#E8E4DE" stroke="#D0C8BE" stroke-width="1"/>
  <rect x="25" y="35" width="52" height="110" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="83" y="35" width="52" height="110" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <!-- Cabinet handles -->
  <rect x="72" y="78" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <rect x="88" y="78" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <rect x="460" y="30" width="120" height="120" rx="3" fill="#E8E4DE" stroke="#D0C8BE" stroke-width="1"/>
  <rect x="465" y="35" width="52" height="110" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="523" y="35" width="52" height="110" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="512" y="78" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <rect x="528" y="78" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <!-- Window between cabinets -->
  <rect x="190" y="40" width="220" height="130" rx="3" stroke="#C8C2B8" stroke-width="2" fill="#F0F5FA"/>
