  <rect x="240" y="222" width="120" height="108" rx="2" fill="#C0B8AE"/>
  <rect x="248" y="230" width="104" height="60" rx="2" fill="#B0A8A0"/>
  <circle cx="272" cy="260" r="10" stroke="#A8A098" stroke-width="1.5" fill="none"/>
  <circle cx="328" cy="260" r="10" stroke="#A8A098" stroke-width="1.5" fill="none"/>
  <circle cx="272" cy="240" r="7" stroke="#A8A098" stroke-width="1" fill="none"/>
  <circle cx="328" cy="240" r="7" stroke="#A8A098" stroke-width="1" fill="none"/>
  <!-- Oven handle -->
  <rect x="265" y="298" width="70" height="3" rx="1" fill="#A8A098"/>
  <!-- Lower cabinets right -->
  <rect x="380" y="222" width="200" height="108" rx="3" fill="#E8E4DE" stroke="#D0C8BE" stroke-width="1"/>
  <rect x="385" y="228" width="90" height="96" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="485" y="228" width="90" height="96" rx="2" fill="#EAE6E0" stroke="#D8D0C8" stroke-width="0.5"/>
  <rect x="472" y="265" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <rect x="488" y="265" width="2" height="20" rx="1" fill="#B0A8A0"/>
  <!-- Range hood -->
  <path d="M250 172 L260 155 L340 155 L350 172" fill="#D8D2C8" stroke="#C8C0B6" stroke-width="1"/>
  <rect x="260" y="150" width="80" height="8" rx="2" fill="#D0C8BE"/>
  <!-- Pendant lights -->
  <line x1="250" y1="0" x2="250" y2="22" stroke="#C0B8AE" stroke-width="1"/>
  <circle cx="250" cy="28" r="8" fill="#E8E2DA" stroke="#D0C8BE" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="22" stroke="#C0B8AE" stroke-width="1"/>
  <circle cx="350" cy="28" r="8" fill="#E8E2DA" stroke="#D0C8BE" stroke-width="1"/>
