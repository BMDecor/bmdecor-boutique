<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Wall -->
  <rect width="600" height="400" fill="#FAFAFA"/>
  <!-- Floor -->
  <rect y="310" width="600" height="90" fill="#E8E2D9"/>
  <line x1="0" y1="310" x2="600" y2="310" stroke="#D5CFC5" stroke-width="1.5"/>
  <!-- Baseboard -->
  <rect y="302" width="600" height="10" fill="#EDEBE6" rx="1"/>
  <!-- Crown molding -->
  <rect y="18" width="600" height="6" fill="#F0EDE8" rx="1"/>
  <!-- Window -->
  <rect x="200" y="50" width="200" height="180" rx="3" stroke="#C8C2B8" stroke-width="2" fill="#F5F8FC"/>
  <line x1="300" y1="50" x2="300" y2="230" stroke="#C8C2B8" stroke-width="1.5"/>
  <line x1="200" y1="140" x2="400" y2="140" stroke="#C8C2B8" stroke-width="1.5"/>
  <!-- Curtains -->
  <rect x="178" y="38" width="24" height="220" rx="4" fill="#E5E0D8"/>
  <rect x="398" y="38" width="24" height="220" rx="4" fill="#E5E0D8"/>
  <rect x="178" y="34" width="244" height="8" rx="2" fill="#D8D2C8"/>
  <!-- Sofa -->
  <rect x="100" y="240" width="280" height="70" rx="12" fill="#B8B0A4"/>
  <rect x="90" y="252" width="30" height="56" rx="8" fill="#AEA698"/>
  <rect x="360" y="252" width="30" height="56" rx="8" fill="#AEA698"/>
  <!-- Sofa back -->
  <rect x="100" y="228" width="280" height="20" rx="6" fill="#A8A094"/>
  <!-- Cushions -->
  <rect x="120" y="250" width="80" height="45" rx="8" fill="#C2BAB0"/>
  <rect x="210" y="250" width="80" height="45" rx="8" fill="#C2BAB0"/>
  <rect x="300" y="250" width="60" height="45" rx="8" fill="#C2BAB0"/>
  <!-- Throw pillows -->
  <rect x="110" y="242" width="32" height="28" rx="6" fill="#C8C0B4" transform="rotate(-8 126 256)"/>
  <rect x="342" y="242" width="32" height="28" rx="6" fill="#C8C0B4" transform="rotate(8 358 256)"/>
  <!-- Coffee table -->
  <rect x="170" y="332" width="140" height="8" rx="2" fill="#A09888"/>
  <rect x="180" y="340" width="4" height="20" fill="#9A9288"/>
  <rect x="296" y="340" width="4" height="20" fill="#9A9288"/>
  <!-- Books on table -->
  <rect x="210" y="326" width="40" height="6" rx="1" fill="#BEB6AA"/>
  <rect x="215" y="320" width="30" height="6" rx="1" fill="#D0C8BE"/>
  <!-- Side table left -->
  <rect x="30" y="270" width="40" height="4" rx="1" fill="#A8A098"/>
  <rect x="36" y="274" width="4" height="30" fill="#A09890"/>
  <rect x="60" y="274" width="4" height="30" fill="#A09890"/>
  <!-- Lamp -->
  <rect x="44" y="230" width="4" height="40" fill="#B8B0A8"/>
  <path d="M32 230 L60 230 L54 210 L38 210 Z" fill="#D8D2CA"/>
  <ellipse cx="50" cy="208" rx="3" ry="2" fill="#F0E8D8"/>
  <!-- Side table right -->
  <rect x="420" y="270" width="40" height="4" rx="1" fill="#A8A098"/>
  <rect x="426" y="274" width="4" height="30" fill="#A09890"/>
  <rect x="450" y="274" width="4" height="30" fill="#A09890"/>
  <!-- Plant -->
  <rect x="432" y="258" width="16" height="14" rx="3" fill="#A8A098"/>
  <ellipse cx="440" cy="248" rx="14" ry="14" fill="#B8C4A8"/>
  <ellipse cx="434" cy="242" rx="10" ry="10" fill="#C0CCA8"/>
  <!-- Rug -->
  <rect x="130" y="340" width="220" height="40" rx="4" fill="#D8D2CA" opacity="0.5"/>
  <!-- Art frame -->
  <rect x="460" y="80" width="80" height="60" rx="2" stroke="#C0B8AE" stroke-width="2" fill="#EAE6E0"/>
  <rect x="468" y="88" width="64" height="44" rx="1" fill="#D8D2CA"/>
  <!-- Floor lamp right -->
  <rect x="520" y="180" width="3" height="130" fill="#B0A8A0"/>
  <path d="M508 180 L536 180 L530 158 L514 158 Z" fill="#C8C0B8"/>
</svg>
