<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Wall -->
  <rect width="600" height="400" fill="#FAFAFA"/>
  <!-- Floor -->
  <rect y="320" width="600" height="80" fill="#E0D8CE"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#D5CFC5" stroke-width="1.5"/>
  <!-- Baseboard -->
  <rect y="312" width="600" height="10" fill="#EDEBE6" rx="1"/>
  <!-- Crown molding -->
  <rect y="18" width="600" height="6" fill="#F0EDE8" rx="1"/>
  <!-- Window -->
  <rect x="220" y="40" width="160" height="160" rx="3" stroke="#C8C2B8" stroke-width="2" fill="#F0F4F8"/>
  <line x1="300" y1="40" x2="300" y2="200" stroke="#C8C2B8" stroke-width="1.5"/>
  <line x1="220" y1="120" x2="380" y2="120" stroke="#C8C2B8" stroke-width="1.5"/>
  <!-- Curtains -->
  <rect x="198" y="28" width="22" height="210" rx="4" fill="#E5E0D8"/>
  <rect x="380" y="28" width="22" height="210" rx="4" fill="#E5E0D8"/>
  <rect x="196" y="24" width="210" height="8" rx="2" fill="#D8D2C8"/>
  <!-- Headboard -->
  <rect x="110" y="180" width="380" height="80" rx="8" fill="#B0A898"/>
  <!-- Headboard detail -->
  <rect x="120" y="188" width="360" height="64" rx="6" fill="#BAB2A6"/>
  <!-- Bed -->
  <rect x="100" y="260" width="400" height="60" rx="6" fill="#D8D0C6"/>
  <!-- Duvet -->
  <rect x="105" y="262" width="390" height="50" rx="5" fill="#E2DCD4"/>
  <!-- Duvet fold -->
  <rect x="105" y="262" width="390" height="14" rx="3" fill="#D0C8BE"/>
  <!-- Pillows -->
  <rect x="140" y="242" width="90" height="26" rx="10" fill="#E8E4DE"/>
  <rect x="250" y="242" width="90" height="26" rx="10" fill="#E8E4DE"/>
  <rect x="360" y="242" width="90" height="26" rx="10" fill="#E8E4DE"/>
  <!-- Accent pillow -->
  <rect x="185" y="246" width="40" height="20" rx="8" fill="#C8C0B6"/>
  <rect x="370" y="246" width="40" height="20" rx="8" fill="#C8C0B6"/>
  <!-- Nightstand left -->
  <rect x="30" y="268" width="55" height="50" rx="4" fill="#A8A098"/>
  <rect x="34" y="272" width="47" height="18" rx="2" fill="#B0A8A0"/>
  <!-- Nightstand lamp left -->
  <rect x="53" y="228" width="4" height="40" fill="#B8B0A8"/>
  <ellipse cx="55" cy="220" rx="16" ry="12" fill="#DCD6CE"/>
  <!-- Nightstand right -->
  <rect x="515" y="268" width="55" height="50" rx="4" fill="#A8A098"/>
  <rect x="519" y="272" width="47" height="18" rx="2" fill="#B0A8A0"/>
  <!-- Nightstand lamp right -->
  <rect x="539" y="228" width="4" height="40" fill="#B8B0A8"/>
  <ellipse cx="541" cy="220" rx="16" ry="12" fill="#DCD6CE"/>
  <!-- Art above bed -->
  <rect x="240" y="70" width="120" height="90" rx="2" stroke="#C0B8AE" stroke-width="1.5" fill="#EBE7E2"/>
  <!-- Plant -->
  <rect x="36" y="254" width="14" height="14" rx="3" fill="#A8A098"/>
  <ellipse cx="43" cy="246" rx="10" ry="10" fill="#B8C4A8"/>
  <!-- Rug -->
  <rect x="160" y="330" width="280" height="35" rx="4" fill="#D0C8BE" opacity="0.4"/>
</svg>
